name: Build project
on:
  push:
    branches:
      - main
    paths:
      - '**/*.lean'
      - '**/blueprint.yml'
      - 'blueprint/**'
      - 'docs/**'
      - 'scripts/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.lean'
      - '**/blueprint.yml'
      - 'blueprint/**'
      - 'docs/**'
      - 'scripts/**'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# We do not cancel CI on main so as to keep all commits green (cancelling CI on a commit makes it
# red).

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and modify PR labels
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  style_lint:
    name: Lint style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Don't 'import Mathlib', use precise imports
        if: always()
        run: |
          ! (find FLT -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^import Mathlib$')

  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # lean-action drops the test-args input (leanprover/lean-action#163), so
      # export TEST_ARGS directly: lake_test.sh reads it from the environment.
      # Remove once leanprover/lean-action#153 is merged.
      - name: Set TEST_ARGS manually
        run: |
          echo "TEST_ARGS=--iofail" >> "$GITHUB_ENV"
        shell: bash

      - name: Build and lint project
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          lint: true
          mk_all-check: true
          build-args: --iofail
          test-args: --iofail

      - name: Upstreaming dashboard
        uses: leanprover-community/upstreaming-dashboard-action@main
        with:
          website-directory: ./docs
          project-name: FLT
          relevant-labels: FLT
          include-drafts: true

      # Every Pages deploy replaces the whole site, so without this step the API
      # documentation would vanish from https://.../FLT/docs/ at the next push
      # to main. Building it here instead would add ~2 hours to every merge, so
      # it is built on demand by api-docs.yml and merely republished here.
      - name: Restore published API documentation
        if: github.event_name == 'push' # only the deploying runs need it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download api-docs-latest --pattern api-docs.tar.gz --clobber; then
            mkdir -p docs
            tar -xzf api-docs.tar.gz -C docs
            rm api-docs.tar.gz
            echo "Restored API documentation into docs/docs."
          else
            echo "No api-docs-latest release yet; publishing the site without API documentation."
          fi

      # This step builds the blueprint and the Jekyll homepage, and (on pushes
      # to main only) deploys them to GitHub Pages. It is the only thing in this
      # repository that deploys Pages at all.
      #
      # `api-docs: false` skips doc-gen4, which regularly ran for hours and then
      # failed at the very end; that unreliability is why this whole step was
      # disabled in #1066. Re-enable it once docgen can be made reliable again.
      - name: Compile documentation
        uses: leanprover-community/docgen-action@10db47458f91456d87804787d3dfcd914b9a19e3 # 2026-06-07
        with:
          api-docs: false
          blueprint: true
          homepage: docs
